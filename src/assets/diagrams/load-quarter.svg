<?xml version="1.0" encoding="UTF-8"?>
<!--
  load-quarter.svg — Quarter load (25% of one trailer load).

  Generated by scripts/generate-load-diagrams.mjs from the fractions in
  src/data/pricing.ts. Do not hand-edit: rerun the script instead.

  Side elevation of the open utility trailer. The drawn load area is exactly
  25% of the deck area, so the six diagrams form a real
  scale rather than an impression of one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="300" height="180"
     role="img" aria-label="Quarter load, about 25 percent of a full trailer load">
  <defs>
    <pattern id="mesh-load-quarter" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0 L8 8 M8 0 L0 8" stroke="#878D87" stroke-width="0.7" opacity="0.55" />
    </pattern></defs>

  <!-- load, area-proportional -->
  <rect x="30.0" y="106.5" width="240.0" height="11.5" fill="#CFE034" />

  <!-- mesh side rail, drawn over the load so the load sits inside the trailer -->
  <rect x="24" y="72" width="252" height="46" fill="url(#mesh-load-quarter)" />
  <rect x="24" y="72" width="252" height="46" fill="none"
        stroke="#123329" stroke-width="3" />

  <!-- front and rear uprights -->
  <rect x="21" y="64" width="6" height="54" fill="#123329" />
  <rect x="273" y="64" width="6" height="54" fill="#123329" />

  <!-- deck and frame -->
  <rect x="24" y="118" width="252" height="10" fill="#123329" />

  <!-- tongue and coupler -->
  <path d="M24 123 L4 123" stroke="#123329" stroke-width="5" />
  <rect x="0" y="118" width="8" height="10" fill="#123329" />

  <!-- wheels -->
  <circle cx="102" cy="144" r="16" fill="#123329" />
  <circle cx="102" cy="144" r="6" fill="#D8D3C8" />
  <circle cx="142" cy="144" r="16" fill="#123329" />
  <circle cx="142" cy="144" r="6" fill="#D8D3C8" />

  <!-- ground line -->
  <path d="M0 161 L300 161" stroke="#D8D3C8" stroke-width="2" />
</svg>
